name: Deploy PreProd

on:
  push:
    branches:
      - preprod

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Create secrets.env
        run: |
          cd /home/revanthdev/src/MyBackend
          cat <<EOF > secrets.env
          ${{ secrets.PREPROD_ENV_FILE }}
          EOF
          chmod 600 secrets.env

      - name: Deploy
        run: |
          cd /home/revanthdev/src/MyBackend
          git fetch origin
          git checkout preprod
          git reset --hard origin/preprod

          docker compose down
          docker compose up --build -d

          docker image prune -f